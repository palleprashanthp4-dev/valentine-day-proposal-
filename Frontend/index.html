<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 2026</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-bar">
    <div class="initial">M.</div>
    <div class="valentine">Valentine 2026</div>
</div>

<div class="main">
    <div class="bg-heart" style="top: 10%; left: 8%; font-size: 22px; animation-delay: 0s;">♥</div>
    <div class="bg-heart" style="top: 20%; right: 10%; font-size: 16px; animation-delay: 1s;">♥</div>
    <div class="bg-heart" style="top: 50%; left: 5%; font-size: 18px; animation-delay: 2s;">♥</div>
    <div class="bg-heart" style="top: 60%; right: 8%; font-size: 24px; animation-delay: 0.5s;">♥</div>
    <div class="bg-heart" style="bottom: 25%; left: 12%; font-size: 14px; animation-delay: 1.5s;">♥</div>
    <div class="bg-heart" style="bottom: 15%; right: 15%; font-size: 20px; animation-delay: 0.8s;">♥</div>
    
    <div class="envelope-wrapper" id="envelopeWrapper">
        <div class="envelope" id="envelope">
            <div class="envelope-back"></div>
            <div class="card" id="card">
                <div class="card-text" id="cardText">Will you be my Valentine, Mahitha?</div>
                <div class="buttons" id="buttons">
                    <button class="btn btn-yes" id="yesBtn">YES!</button>
                    <button class="btn btn-no" id="noBtn">No</button>
                </div>
            </div>
            <div class="seal">M</div>
            <div class="envelope-front"></div>
            <div class="envelope-flap"></div>
        </div>
    </div>
    
    <div class="tap-hint" id="tapHint">TAP TO OPEN</div>
    <div class="name-below">Mahitha</div>
</div>

<div class="bottom-bar">
    <div class="forever">Forever yours.</div>
    <div class="crafted">SPECIALLY CRAFTED FOR MAHITHA</div>
</div>

<script src="main.js">

</script>

</body>
</html>
